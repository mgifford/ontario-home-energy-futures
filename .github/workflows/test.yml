name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v
      - name: Build static site offline from fixtures
        run: python build.py
      - name: Check page-weight budget
        run: |
          set -e
          calc_bytes=$(du -cb dist/static/styles.css dist/static/calculator.js | tail -1 | cut -f1)
          echo "Calculator CSS+JS: ${calc_bytes} bytes (budget: 204800)"
          if [ "$calc_bytes" -gt 204800 ]; then
            echo "::error::Calculator CSS+JS exceeds the 200 KB budget documented in README.md"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: dist
          path: dist/

  accessibility-tests:
    runs-on: ubuntu-24.04
    needs: python-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies and build site
        run: |
          pip install -e ".[dev]"
          python build.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Playwright and axe-core
        working-directory: tests/accessibility
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run accessibility and browser specs
        working-directory: tests/accessibility
        run: npx playwright test
