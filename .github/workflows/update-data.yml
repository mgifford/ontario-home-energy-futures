name: Update data

# Scheduled retrieval of live source data (Phase 2). Fails safely: if a
# retrieved source fails validation or fails to parse, the job fails without
# committing anything, so previously normalized data is never overwritten by
# a malformed automated update. See DATA_SOURCES.md and METHODOLOGY.md.

on:
  schedule:
    - cron: "0 13 1,15 * *" # twice monthly, aligned with typical OEB rate revision timing
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-oeb-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Fetch and validate latest OEB BillData.xml
        run: |
          python3 - <<'PY'
          import sys
          from datetime import date
          from pathlib import Path

          sys.path.insert(0, "src")
          from ontario_home_energy_futures.collect.oeb_fetch import fetch_oeb_billdata
          from ontario_home_energy_futures.normalize.oeb import parse_oeb_billdata, MalformedSourceError
          from ontario_home_energy_futures.validate.provenance import sha256_of_file, validate_observation, ProvenanceError

          today = date.today().isoformat()
          dest = Path("data/raw/oeb") / f"billdata-{today}.xml"

          try:
              fetch_oeb_billdata(dest)
              digest = sha256_of_file(dest)
              records = parse_oeb_billdata(
                  dest, source_url="https://www.oeb.ca/_html/calculator/data/BillData.xml",
                  source_sha256=digest, retrieved_at=today,
              )
              for r in records:
                  validate_observation(r)
          except (MalformedSourceError, ProvenanceError) as exc:
              print(f"::error::Retrieved source failed validation, not committing: {exc}")
              dest.unlink(missing_ok=True)
              sys.exit(1)
          except Exception as exc:  # network or unexpected failure
              print(f"::warning::Could not retrieve live OEB data this run: {exc}")
              dest.unlink(missing_ok=True)
              sys.exit(0)

          print(f"Retrieved and validated {dest}, sha256={digest}")
          print("Add a new data/source-manifest.yaml entry referencing this file, "
                "then run: python -m ontario_home_energy_futures.normalize")
          PY
      - name: Open pull request with new raw data, if any
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "data: add new OEB rate snapshot"
          title: "Scheduled data update: OEB rates"
          body: >
            Automated retrieval of the latest OEB BillData.xml. Review the new
            raw file and source-manifest.yaml entry, then run the normalize
            pipeline and tests before merging. Never edit an existing raw
            file or manifest entry in place.
          branch: automated/oeb-data-update
          add-paths: data/raw/oeb/*
