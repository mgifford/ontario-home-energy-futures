# Assumptions register.
#
# Every numeric default that materially affects a result should have an
# entry here, cross-referencing the actual YAML file the model reads. This
# register exists so a reader can see every assumption's confidence
# profile in one place without opening a dozen files - it does not
# replace assumptions/*.yaml, which remains the source the code loads.
#
# type must be one of the project's provenance statuses:
#   observed | estimate | scenario | projection
#
# Confidence is recorded as three SEPARATE dimensions and must never be
# collapsed into one score:
#   evidence_quality      - how solid is the underlying data/methodology
#   ontario_applicability - how well does it reflect Ontario specifically
#   temporal_stability     - how likely is this to still be true in 1-3 years

schema_version: "1.0"

assumptions:
  - id: assumption-loan-interest-rate-default
    name: Default loan annual interest rate
    value: 0.079
    unit: annual_fraction
    type: estimate
    base_year: 2026
    range:
      low: 0.03
      high: 0.12
    source_urls: []
    rationale: >
      Illustrative representative rate for a secured home-improvement
      loan; not tied to any specific lender's published rate. User-editable.
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: low
    affects:
      - purchase_timing
      - financing_comparison
      - cost_of_inaction
    editable: true
    source_file: assumptions/financing.yaml

  - id: assumption-discount-rate-default
    name: Default discount rate for present-value calculations
    value: 0.04
    unit: annual_fraction
    type: estimate
    base_year: 2026
    range:
      low: 0.02
      high: 0.06
    source_urls: []
    rationale: >
      Illustrative real discount rate used to compute NPV across the
      planning horizon. Not derived from a specific Ontario household's
      actual opportunity cost - user-editable.
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: medium
    affects:
      - purchase_timing
      - cost_of_waiting
      - cost_of_inaction
    editable: true
    source_file: assumptions/ontario.yaml

  - id: assumption-general-inflation-default
    name: Default general inflation rate
    value: 0.02
    unit: annual_fraction
    type: estimate
    base_year: 2026
    range:
      low: 0.01
      high: 0.04
    source_urls: []
    rationale: >
      Standard central-bank-target-adjacent inflation assumption, kept
      separate from every bill component's own real growth rate so
      nominal and real results never get conflated.
    confidence:
      evidence_quality: medium
      ontario_applicability: medium
      temporal_stability: low
    affects:
      - purchase_timing
      - cost_of_waiting
    editable: true
    source_file: assumptions/ontario.yaml

  - id: assumption-electricity-price-reference-energy-real
    name: Reference scenario real annual electricity-energy-charge growth
    value: 0.015
    unit: annual_fraction
    type: scenario
    base_year: 2026
    range:
      low: 0.000
      high: 0.030
    source_urls: []
    rationale: >
      Illustrative central scenario, not an official forecast. Ranges
      from the Low scenario (0%) to the High scenario (3%); Stress
      scenario goes to 5%. See scenarios/*.yaml.
    confidence:
      evidence_quality: low
      ontario_applicability: medium
      temporal_stability: low
    affects:
      - purchase_timing
      - cost_of_waiting
      - current_costs_projection
    editable: true
    source_file: scenarios/reference.yaml

  - id: assumption-installed-solar-decline-reference
    name: Reference real decline in complete Ontario installed solar cost
    value: -0.02
    unit: annual_fraction
    type: scenario
    base_year: 2026
    range:
      low: 0
      high: -0.04
    source_urls: []
    rationale: >
      Illustrative sensitivity assumption. Not an official forecast.
      Deliberately NOT derived from applying a global solar-module price
      index directly to complete Ontario installed cost, because labour,
      permitting, connection, and overhead do not track module prices at
      the same rate.
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: low
    affects:
      - purchase_timing
      - cost_of_waiting
    editable: true
    source_file: scenarios/solar-cost-decline/moderate.yaml

  - id: assumption-solar-panel-degradation-annual
    name: Default annual solar panel degradation rate
    value: 0.005
    unit: annual_fraction
    type: estimate
    base_year: 2026
    range:
      low: 0.003
      high: 0.008
    source_urls: []
    rationale: >
      Typical published panel-degradation range from manufacturer
      datasheets in general use; not Ontario-climate-specific.
    confidence:
      evidence_quality: medium
      ontario_applicability: low
      temporal_stability: high
    affects:
      - solar_production
      - purchase_timing
    editable: true
    source_file: assumptions/solar.yaml

  - id: assumption-ottawa-regional-solar-yield
    name: Ottawa-region monthly solar yield (kWh per installed kW DC)
    value: 1276
    unit: kwh_per_kw_annual
    type: estimate
    base_year: 2026
    range:
      low: 1100
      high: 1400
    source_urls: []
    rationale: >
      Single illustrative regional profile pending integration of a
      verified Canadian solar-resource dataset (e.g. NRCan). The file's
      own comment states this needs verification before being treated as
      authoritative.
    confidence:
      evidence_quality: low
      ontario_applicability: medium
      temporal_stability: high
    affects:
      - solar_production
      - net_metering_ledger
      - purchase_timing
    editable: false
    source_file: assumptions/solar.yaml

  - id: assumption-hydro-ottawa-tou-rates
    name: Hydro Ottawa time-of-use rates (fixture)
    value: null
    unit: cad_per_kwh_by_period
    type: estimate
    base_year: 2026
    range: null
    source_urls:
      - https://www.oeb.ca/_html/calculator/data/BillData.xml
    rationale: >
      Illustrative fixture approximating 2026 OEB-regulated rate levels;
      NOT verified against a live fetch of the OEB BillData.xml in this
      build environment. Verify before treating as current.
    confidence:
      evidence_quality: medium
      ontario_applicability: high
      temporal_stability: low
    affects:
      - bill_reconstruction
      - net_metering_ledger
      - purchase_timing
    editable: false
    source_file: assumptions/utilities/hydro-ottawa.yaml

  - id: assumption-net-metering-credit-expiry-months
    name: Net-metering credit carry-forward period
    value: 12
    unit: months
    type: observed
    base_year: 2026
    range: null
    source_urls:
      - https://www.oeb.ca/consumer-information-and-protection/net-metering
    rationale: Directly from OEB net-metering consumer guidance.
    confidence:
      evidence_quality: high
      ontario_applicability: high
      temporal_stability: medium
    affects:
      - net_metering_ledger
      - purchase_timing
    editable: false
    source_file: assumptions/ontario.yaml

  - id: assumption-ieso-demand-growth-reference
    name: IESO reference-scenario provincial system demand growth to 2050
    value: 0.65
    unit: fraction_by_2050
    type: projection
    base_year: 2026
    range:
      low: 0.38
      high: 0.92
    source_urls:
      - https://www.ieso.ca/-/media/Files/IESO/Document-Library/planning-forecasts/apo/2026/2026-Annual-Planning-Outlook.pdf
    rationale: >
      From the IESO 2026 Annual Planning Outlook, as recorded in the
      project brief. Never converted into a household kWh addition or a
      retail-price growth number anywhere in this model - shown only as
      context for electricity-price uncertainty.
    confidence:
      evidence_quality: medium
      ontario_applicability: high
      temporal_stability: low
    affects:
      - context_only_not_used_in_calculations
    editable: false
    source_file: assumptions/ontario.yaml
    notes: >
      See data/governance/claims.yaml claim-ieso-demand-growth-2050 for
      the status-label discrepancy this register intentionally flags:
      assumptions/ontario.yaml labels this status: observed while its own
      notes admit the figure is pending verification against the
      published PDF. This entry uses type: projection (not observed) to
      avoid repeating that inconsistency here.

  - id: assumption-collective-purchasing-overall-discount-cap
    name: Overall collective-purchasing discount cap (10-household tier)
    value: 0.10
    unit: fraction
    type: scenario
    base_year: 2026
    range:
      low: 0.07
      high: 0.13
    source_urls: []
    rationale: >
      Generalized illustrative estimate of achievable group-purchase
      savings (lower customer-acquisition cost, shared scheduling, bulk
      equipment purchasing); not measured against actual Ontario group
      buy outcomes.
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: medium
    affects:
      - purchase_timing
      - cost_of_waiting
      - equity_considerations
    editable: true
    source_file: assumptions/collective_purchasing.yaml

  - id: assumption-battery-round-trip-efficiency
    name: Illustrative reference battery round-trip efficiency
    value: 0.90
    unit: fraction
    type: estimate
    base_year: 2026
    range:
      low: 0.85
      high: 0.95
    source_urls: []
    rationale: >
      Typical published lithium-ion home-battery round-trip efficiency
      range; not tied to a specific product.
    confidence:
      evidence_quality: medium
      ontario_applicability: low
      temporal_stability: high
    affects:
      - battery_dispatch
      - net_revenue_calculation
    editable: true
    source_file: assumptions/batteries.yaml

  - id: assumption-illustrative-reference-quote
    name: Illustrative reference solar quote (7.2 kW system, before tax)
    value: 21000
    unit: cad
    type: estimate
    base_year: 2026
    range:
      low: 15000
      high: 30000
    source_urls: []
    rationale: >
      Placeholder used only when no user-entered quote or contributed
      quote data is available; explicitly not a market price estimate.
      See docs/RED-TEAM-REVIEW.md section 1.1 for the open concern that
      this value is pre-filled into a live form field without the
      caveat reaching the user.
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: low
    affects:
      - purchase_timing
      - cost_of_waiting
      - consumer_protection_risk
    editable: true
    source_file: assumptions/solar.yaml

  - id: assumption-vpp-availability-payment-rate
    name: Illustrative VPP availability payment rate
    value: 3.50
    unit: cad_per_kw_month
    type: scenario
    base_year: 2026
    range:
      low: 0
      high: 8.00
    source_urls:
      - https://www.oeb.ca/sites/default/files/2025-AUG__Assessment-of-Ontario-DER.pdf
    rationale: >
      No general residential VPP availability-payment programme
      currently operates in Ontario. This figure is a clearly labelled
      illustrative scenario value only, excluded from every default
      bundle by construction (ValueStreamStatus.ILLUSTRATIVE_SCENARIO).
    confidence:
      evidence_quality: low
      ontario_applicability: low
      temporal_stability: low
    affects:
      - future_scenario_only_not_default
    editable: true
    source_file: assumptions/value_streams/10-vpp-availability.yaml
