    type: observed_fact
    jurisdiction: Ontario
    source_url: null
    source_publisher: null
    verified_at: 2026-08-03
    review_due: 2027-08-01
    confidence:
      source_quality: high
      local_applicability: high
      temporal_stability: medium
    status: approved
    display_locations:
