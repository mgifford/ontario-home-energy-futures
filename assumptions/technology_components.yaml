# Per-component technology-cost-decline scenarios.
#
# Modelled separately from model/decline.py's single blended-quote decline
# (used by Phase 1 pages) because global module-price declines do not apply
# uniformly to labour, permitting, or connection costs. See METHODOLOGY.md
# section 17 and the project brief's "Technology-cost decline" section.
#
# These are illustrative scenario values, not forecasts. Editable per
# component and per scenario tier.

